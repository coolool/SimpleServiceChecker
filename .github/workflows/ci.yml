name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies and Windows runtime pack
        run: dotnet restore SimpleServiceChecker.sln --locked-mode

      - name: Build
        run: dotnet build SimpleServiceChecker.sln --configuration Release --no-restore

      - name: Check browser JavaScript syntax
        run: node --check src/SimpleServiceChecker.App/Web/app.js

      - name: Test
        run: dotnet test SimpleServiceChecker.sln --configuration Release --no-build

      - name: Publish self-contained Windows application
        run: dotnet publish src/SimpleServiceChecker.App/SimpleServiceChecker.App.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/proof

      - name: Upload Windows application build
        uses: actions/upload-artifact@v4
        with:
          name: SimpleServiceChecker-win-x64
          path: artifacts/proof
          if-no-files-found: error
