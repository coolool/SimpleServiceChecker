name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Scan tracked repository for prohibited data
        shell: pwsh
        run: ./build/Test-RepositorySafety.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies and Windows runtime pack
        run: dotnet restore SimpleServiceChecker.sln --locked-mode

      - name: Build
        run: dotnet build SimpleServiceChecker.sln --configuration Release --no-restore

      - name: Check browser JavaScript syntax
        run: node --check src/SimpleServiceChecker.App/Web/app.js

      - name: Test
        run: dotnet test SimpleServiceChecker.sln --configuration Release --no-build

      - name: Build previous-version installer fixture
        shell: pwsh
        run: |
          ./build/Build-Installer.ps1 `
            -Version 0.9.0 `
            -PublishDirectory artifacts/publish-previous `
            -OutputDirectory artifacts/installer-previous `
            -SourceRepository $env:GITHUB_REPOSITORY `
            -SourceCommit $env:GITHUB_SHA `
            -SkipRestore

      - name: Build current per-user installer
        shell: pwsh
        run: |
          ./build/Build-Installer.ps1 `
            -Version 1.0.0 `
            -PublishDirectory artifacts/publish-current `
            -OutputDirectory artifacts/installer `
            -SourceRepository $env:GITHUB_REPOSITORY `
            -SourceCommit $env:GITHUB_SHA `
            -SkipRestore

      - name: Verify unsigned release artifacts
        shell: pwsh
        run: |
          ./build/Test-ReleaseArtifacts.ps1 `
            -ArtifactDirectory artifacts/installer-previous `
            -Version 0.9.0 `
            -ExpectedUpdateLocationUrl https://github.com/coolool/StarlingServiceChecker-Releases/releases/latest `
            -ExpectedSourceRepository $env:GITHUB_REPOSITORY `
            -ExpectedSourceCommit $env:GITHUB_SHA
          ./build/Test-ReleaseArtifacts.ps1 `
            -ArtifactDirectory artifacts/installer `
            -Version 1.0.0 `
            -ExpectedUpdateLocationUrl https://github.com/coolool/StarlingServiceChecker-Releases/releases/latest `
            -ExpectedSourceRepository $env:GITHUB_REPOSITORY `
            -ExpectedSourceCommit $env:GITHUB_SHA

      - name: Test installer lifecycle
        shell: pwsh
        run: |
          ./build/Test-InstallerLifecycle.ps1 `
            -PreviousInstaller artifacts/installer-previous/StarlingServiceChecker-Setup-0.9.0.exe `
            -PreviousVersion 0.9.0 `
            -CurrentInstaller artifacts/installer/StarlingServiceChecker-Setup-1.0.0.exe `
            -CurrentVersion 1.0.0

      - name: Upload Windows installer proof
        uses: actions/upload-artifact@v6
        with:
          name: StarlingServiceChecker-unsigned-installer-proof
          path: |
            artifacts/installer/StarlingServiceChecker-Setup-1.0.0.exe
            artifacts/installer/StarlingServiceChecker-Setup-1.0.0.exe.sha256
            artifacts/installer/StarlingServiceChecker-1.0.0-release.json
          if-no-files-found: error
