name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Scan tracked repository for prohibited data
        shell: pwsh
        run: ./build/Test-RepositorySafety.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies and Windows runtime pack
        run: dotnet restore SimpleServiceChecker.sln --locked-mode

      - name: Build
        run: dotnet build SimpleServiceChecker.sln --configuration Release --no-restore

      - name: Check browser JavaScript syntax
        run: node --check src/SimpleServiceChecker.App/Web/app.js

      - name: Test
        run: dotnet test SimpleServiceChecker.sln --configuration Release --no-build

      - name: Build previous-version installer fixture
        shell: pwsh
        run: |
          ./build/Build-Installer.ps1 `
            -Version 0.9.0 `
            -PublishDirectory artifacts/publish-previous `
            -OutputDirectory artifacts/installer-previous `
            -SkipRestore

      - name: Build current per-user installer
        shell: pwsh
        run: |
          ./build/Build-Installer.ps1 `
            -Version 1.0.0 `
            -PublishDirectory artifacts/publish-current `
            -OutputDirectory artifacts/installer `
            -SkipRestore

      - name: Test installer lifecycle
        shell: pwsh
        run: |
          ./build/Test-InstallerLifecycle.ps1 `
            -PreviousInstaller artifacts/installer-previous/StarlingServiceChecker-Setup-0.9.0.exe `
            -PreviousVersion 0.9.0 `
            -CurrentInstaller artifacts/installer/StarlingServiceChecker-Setup-1.0.0.exe `
            -CurrentVersion 1.0.0

      - name: Create ephemeral CI signing certificate
        timeout-minutes: 2
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'starling-ci-signing.cer'
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=Starling Service Checker CI Test' `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddDays(1)
          Export-Certificate -Cert $certificate -FilePath $certificatePath | Out-Null

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -File |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw 'signtool.exe was not found on the runner.' }
          "CI_SIGNING_CERT_SHA1=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CI_SIGNING_CERT_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNTOOL_PATH=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build with ephemeral Authenticode certificate
        timeout-minutes: 5
        shell: pwsh
        run: |
          ./build/Build-Installer.ps1 `
            -Version 1.0.0 `
            -PublishDirectory artifacts/publish-signed-test `
            -OutputDirectory artifacts/installer-signed-test `
            -SkipRestore `
            -SignToolPath $env:SIGNTOOL_PATH `
            -SigningCertificateThumbprint $env:CI_SIGNING_CERT_SHA1 `
            -AllowEphemeralTestSigning

      - name: Verify signed installer lifecycle
        timeout-minutes: 3
        shell: pwsh
        run: |
          ./build/Test-InstallerLifecycle.ps1 `
            -CurrentInstaller artifacts/installer-signed-test/StarlingServiceChecker-Setup-1.0.0.exe `
            -CurrentVersion 1.0.0 `
            -VerifySignatures `
            -SignToolPath $env:SIGNTOOL_PATH `
            -ExpectedSignerThumbprint $env:CI_SIGNING_CERT_SHA1 `
            -AllowUntrustedTestCertificate

      - name: Remove ephemeral CI signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:CI_SIGNING_CERT_SHA1 -match '^[0-9A-Fa-f]{40}$') {
            & certutil.exe -user -delstore My $env:CI_SIGNING_CERT_SHA1
          }
          if (-not [string]::IsNullOrWhiteSpace($env:CI_SIGNING_CERT_PATH)) {
            Remove-Item -LiteralPath $env:CI_SIGNING_CERT_PATH -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows installer proof
        uses: actions/upload-artifact@v6
        with:
          name: StarlingServiceChecker-unsigned-installer-proof
          path: |
            artifacts/installer/StarlingServiceChecker-Setup-1.0.0.exe
            artifacts/installer/StarlingServiceChecker-Setup-1.0.0.exe.sha256
            artifacts/installer/StarlingServiceChecker-1.0.0-release.json
          if-no-files-found: error
