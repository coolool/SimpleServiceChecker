name: Public unsigned draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated version tag to build, such as v1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-test-draft:
    runs-on: windows-latest
    env:
      REQUESTED_TAG: ${{ inputs.tag }}
      RELEASE_REPOSITORY: coolool/StarlingServiceChecker-Releases
      UPDATE_LOCATION_URL: https://github.com/coolool/StarlingServiceChecker-Releases/releases/latest
      COVERAGE_TEMPLATE_NAME: StarlingServiceChecker-Coverage-Template.xlsx
      COVERAGE_TEMPLATE_URL: https://raw.githubusercontent.com/coolool/StarlingServiceChecker-Releases/main/StarlingServiceChecker-Coverage-Template.xlsx
      COVERAGE_TEMPLATE_SHA256: 50f5c1a7f7e504683fbb44907661e1dc3eb02420314a7c45d38395fd7480f73e
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Resolve and validate release version
        id: release
        shell: pwsh
        run: |
          $tag = $env:REQUESTED_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Release tag must use vMAJOR.MINOR.PATCH.'
          }
          git rev-parse --verify "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Tag $tag does not exist." }
          $tagType = git cat-file -t "refs/tags/$tag"
          if ($tagType -ne 'tag') { throw "Release tag $tag must be annotated." }
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$tag^{commit}" refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag $tag is not on the main branch." }
          $tagCommit = git rev-parse "$tag^{commit}"
          $headCommit = git rev-parse HEAD
          if ($tagCommit -ne $headCommit) { throw "Checked-out commit does not match release tag $tag." }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_COMMIT=$tagCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore, build, and test
        shell: pwsh
        run: |
          ./build/Test-RepositorySafety.ps1
          dotnet restore SimpleServiceChecker.sln --locked-mode
          dotnet build SimpleServiceChecker.sln --configuration Release --no-restore
          node --check src/SimpleServiceChecker.App/Web/app.js
          dotnet test SimpleServiceChecker.sln --configuration Release --no-build

      - name: Build unsigned installer
        shell: pwsh
        run: |
          ./build/Build-Installer.ps1 `
            -Version $env:RELEASE_VERSION `
            -UpdateLocationUrl $env:UPDATE_LOCATION_URL `
            -SourceRepository $env:GITHUB_REPOSITORY `
            -SourceCommit $env:SOURCE_COMMIT `
            -SkipRestore

      - name: Verify install, upgrade, and uninstall
        shell: pwsh
        run: |
          ./build/Test-InstallerLifecycle.ps1 `
            -CurrentInstaller "artifacts/installer/StarlingServiceChecker-Setup-$env:RELEASE_VERSION.exe" `
            -CurrentVersion $env:RELEASE_VERSION

      - name: Download and validate blank coverage template
        shell: pwsh
        run: |
          $templatePath = Join-Path 'artifacts/installer' $env:COVERAGE_TEMPLATE_NAME
          Invoke-WebRequest -Uri $env:COVERAGE_TEMPLATE_URL -OutFile $templatePath
          $actualHash = (Get-FileHash -LiteralPath $templatePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:COVERAGE_TEMPLATE_SHA256) {
            throw "Coverage template SHA-256 mismatch. Expected $env:COVERAGE_TEMPLATE_SHA256 but found $actualHash."
          }
          $env:SSC_TEST_TEMPLATE = [IO.Path]::GetFullPath($templatePath)
          dotnet test tests/SimpleServiceChecker.Core.Tests/SimpleServiceChecker.Core.Tests.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            --filter FullyQualifiedName~ReleaseTemplate_ContainsOnlyTheRequiredBlankWorkbookContract

      - name: Verify public release artifacts
        shell: pwsh
        run: |
          ./build/Test-ReleaseArtifacts.ps1 `
            -ArtifactDirectory artifacts/installer `
            -Version $env:RELEASE_VERSION `
            -ExpectedUpdateLocationUrl $env:UPDATE_LOCATION_URL `
            -ExpectedSourceRepository $env:GITHUB_REPOSITORY `
            -ExpectedSourceCommit $env:SOURCE_COMMIT `
            -ExpectedCoverageTemplateSha256 $env:COVERAGE_TEMPLATE_SHA256 `
            -RequireGitHubReleasesUpdateLocation

      - name: Upload private workflow evidence
        uses: actions/upload-artifact@v6
        with:
          name: StarlingServiceChecker-${{ steps.release.outputs.version }}-unsigned
          path: artifacts/installer
          if-no-files-found: error

      - name: Create or update public draft release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Configure PUBLIC_RELEASE_TOKEN as a fine-grained token with Contents read/write access only to the public release repository.'
          }
          $assets = @(
            "artifacts/installer/StarlingServiceChecker-Setup-$env:RELEASE_VERSION.exe",
            "artifacts/installer/StarlingServiceChecker-Setup-$env:RELEASE_VERSION.exe.sha256",
            "artifacts/installer/StarlingServiceChecker-$env:RELEASE_VERSION-release.json",
            "artifacts/installer/$env:COVERAGE_TEMPLATE_NAME"
          )
          $notes = @"
          Starling Service Checker $env:RELEASE_VERSION

          This Windows installer is intentionally unsigned. Windows may show an Unknown publisher or Microsoft Defender SmartScreen warning. Download only from this official repository. If your organization's policy blocks unsigned applications, contact your IT team and do not disable security controls.

          A blank coverage workbook is included as $env:COVERAGE_TEMPLATE_NAME. It contains the required Tower Coverage and Fibre Coverage tabs and no company data. Keep the worksheet names and header row unchanged while entering coverage.

          Source repository: $env:GITHUB_REPOSITORY
          Source commit: $env:SOURCE_COMMIT
          "@
          $existingReleaseJson = gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existingRelease = $existingReleaseJson | ConvertFrom-Json
            if (-not $existingRelease.isDraft) {
              throw "Release $env:RELEASE_TAG is already published. Refusing to replace its assets."
            }
            gh release upload $env:RELEASE_TAG @assets --repo $env:RELEASE_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not update public draft release assets.' }
            gh release edit $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --title "Starling Service Checker $env:RELEASE_VERSION" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not update public draft release notes.' }
          }
          else {
            gh release create $env:RELEASE_TAG @assets --repo $env:RELEASE_REPOSITORY --target main --draft --title "Starling Service Checker $env:RELEASE_VERSION" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the public draft release.' }
          }
